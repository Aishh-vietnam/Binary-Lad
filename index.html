<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BinaryLab</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #06111f;
    color: #e8f2ff;
}

.container {
    max-width: 480px;
    margin: auto;
    padding: 20px 15px 35px;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    margin: 0;
    font-size: 30px;
    color: #55b8ff;
}

header p {
    margin: 7px 0 0;
    color: #8297ad;
    font-size: 14px;
}

/* CARD */

.card {
    background: #0c1b2d;
    border: 1px solid #183754;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.card h2 {
    margin: 0 0 15px;
    font-size: 18px;
}

/* INPUT */

input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;

    border: 1px solid #294866;
    border-radius: 10px;

    background: #071525;
    color: white;

    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #3da9ff;
}

/* BUTTON */

button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 10px;

    background: #147dcc;
    color: white;

    font-size: 15px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

/* RESULT */

.result {
    margin-top: 12px;
    padding: 12px;

    min-height: 45px;

    border-radius: 10px;

    background: #071525;

    color: #62bcff;

    text-align: center;
    font-weight: bold;

    word-break: break-word;
}

/* BINARY OPERATION */

.operation {
    display: grid;

    grid-template-columns:
        1fr 45px 1fr;

    gap: 7px;

    align-items: center;
}

.operation input {
    margin-bottom: 0;
}

.symbol {
    text-align: center;

    font-size: 22px;
    font-weight: bold;

    color: #55b8ff;
}

/* GAME */

.game-box {
    text-align: center;
}

.question {
    margin: 15px 0;

    padding: 20px 10px;

    background: #071525;

    border-radius: 12px;

    color: #62bcff;

    font-size: 24px;
    font-weight: bold;
}

.score {
    color: #9db0c5;

    margin-bottom: 10px;
}

.feedback {
    min-height: 24px;

    margin-top: 12px;

    font-weight: bold;
}

.hidden {
    display: none;
}

footer {
    text-align: center;

    color: #526b83;

    font-size: 12px;

    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<header>

    <h1>BinaryLab</h1>

    <p>
        Learn • Convert • Calculate • Challenge
    </p>

</header>


<!-- =========================
     CONVERT
========================= -->

<div class="card">

    <h2>🔄 Chuyển đổi</h2>

    <label>Số cần chuyển</label>

    <input
        id="convertInput"
        type="text"
        placeholder="Ví dụ: 1011"
    >

    <label>Chọn phép chuyển đổi</label>

    <select id="convertType">

        <option value="binToDec">
            Nhị phân → Thập phân
        </option>

        <option value="decToBin">
            Thập phân → Nhị phân
        </option>

    </select>

    <button onclick="convertNumber()">
        Chuyển đổi
    </button>

    <div
        class="result"
        id="convertResult"
    >
        Kết quả sẽ hiển thị ở đây
    </div>

</div>


<!-- =========================
     ADD
========================= -->

<div class="card">

    <h2>➕ Cộng nhị phân</h2>

    <div class="operation">

        <input
            id="addA"
            type="text"
            placeholder="1011"
        >

        <div class="symbol">
            +
        </div>

        <input
            id="addB"
            type="text"
            placeholder="110"
        >

    </div>

    <button onclick="addBinary()">
        Tính tổng
    </button>

    <div
        class="result"
        id="addResult"
    >
        Kết quả sẽ hiển thị ở đây
    </div>

</div>


<!-- =========================
     MULTIPLY
========================= -->

<div class="card">

    <h2>✖️ Nhân nhị phân</h2>

    <div class="operation">

        <input
            id="mulA"
            type="text"
            placeholder="101"
        >

        <div class="symbol">
            ×
        </div>

        <input
            id="mulB"
            type="text"
            placeholder="11"
        >

    </div>

    <button onclick="multiplyBinary()">
        Tính tích
    </button>

    <div
        class="result"
        id="mulResult"
    >
        Kết quả sẽ hiển thị ở đây
    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div class="card">

    <h2>🎮 Binary Challenge</h2>

    <div class="game-box">

        <div class="score">

            Điểm:
            <span id="gameScore">
                0
            </span>

            /
            <span id="gameTotal">
                0
            </span>

        </div>


        <div
            class="question"
            id="gameQuestion"
        >
            Nhấn "Bắt đầu" để chơi
        </div>


        <input
            id="gameAnswer"
            type="text"
            placeholder="Nhập đáp án"
        >


        <button
            id="gameStart"
            onclick="startGame()"
        >
            Bắt đầu
        </button>


        <button
            id="gameCheck"
            onclick="checkGameAnswer()"
            style="display:none; margin-top:8px;"
        >
            Kiểm tra
        </button>


        <div
            class="feedback"
            id="gameFeedback"
        ></div>

    </div>

</div>


<footer>

    BinaryLab • Binary Learning Tool

</footer>

</div>


<script>

/* ==================================================
   KIỂM TRA SỐ NHỊ PHÂN
================================================== */

function isBinary(value) {

    return /^[01]+$/.test(value);

}


/* ==================================================
   CHUYỂN ĐỔI
================================================== */

function convertNumber() {

    const input =
        document
        .getElementById("convertInput")
        .value
        .trim();


    const type =
        document
        .getElementById("convertType")
        .value;


    const result =
        document
        .getElementById("convertResult");


    if (input === "") {

        result.textContent =
            "Vui lòng nhập một số.";

        return;
    }


    if (type === "binToDec") {

        if (!isBinary(input)) {

            result.textContent =
                "Lỗi: Chỉ được nhập 0 và 1.";

            return;
        }


        const decimal =
            parseInt(input, 2);


        result.textContent =
            input +
            "₂ = " +
            decimal +
            "₁₀";

    }

    else {

        if (!/^\d+$/.test(input)) {

            result.textContent =
                "Lỗi: Vui lòng nhập số thập phân.";

            return;
        }


        const decimal =
            Number(input);


        result.textContent =
            decimal +
            "₁₀ = " +
            decimal.toString(2) +
            "₂";
    }

}


/* ==================================================
   CỘNG
================================================== */

function addBinary() {

    const a =
        document
        .getElementById("addA")
        .value
        .trim();


    const b =
        document
        .getElementById("addB")
        .value
        .trim();


    const result =
        document
        .getElementById("addResult");


    if (!isBinary(a) || !isBinary(b)) {

        result.textContent =
            "Lỗi: Hai số phải chỉ gồm 0 và 1.";

        return;
    }


    const answer =
        parseInt(a, 2) +
        parseInt(b, 2);


    result.textContent =
        a +
        " + " +
        b +
        " = " +
        answer.toString(2);

}


/* ==================================================
   NHÂN
================================================== */

function multiplyBinary() {

    const a =
        document
        .getElementById("mulA")
        .value
        .trim();


    const b =
        document
        .getElementById("mulB")
        .value
        .trim();


    const result =
        document
        .getElementById("mulResult");


    if (!isBinary(a) || !isBinary(b)) {

        result.textContent =
            "Lỗi: Hai số phải chỉ gồm 0 và 1.";

        return;
    }


    const answer =
        parseInt(a, 2) *
        parseInt(b, 2);


    result.textContent =
        a +
        " × " +
        b +
        " = " +
        answer.toString(2);

}


/* ==================================================
   GAME
================================================== */

let gameAnswer = "";

let gameScore = 0;

let gameTotal = 0;


/* Tạo số nguyên ngẫu nhiên */

function randomNumber(max) {

    return Math.floor(
        Math.random() * max
    );

}


/* Tạo câu hỏi */

function createQuestion() {

    const a =
        randomNumber(16);

    const b =
        randomNumber(16);


    const type =
        randomNumber(3);


    let question = "";


    if (type === 0) {

        /*
           NHỊ PHÂN → THẬP PHÂN
        */

        const binary =
            a.toString(2);


        question =
            binary +
            "₂ = ?₁₀";


        gameAnswer =
            String(a);

    }


    else if (type === 1) {

        /*
           CỘNG
        */

        const binaryA =
            a.toString(2);

        const binaryB =
            b.toString(2);


        question =
            binaryA +
            " + " +
            binaryB +
            " = ?";


        gameAnswer =
            (a + b)
            .toString(2);

    }


    else {

        /*
           NHÂN
        */

        const binaryA =
            a.toString(2);

        const binaryB =
            b.toString(2);


        question =
            binaryA +
            " × " +
            binaryB +
            " = ?";


        gameAnswer =
            (a * b)
            .toString(2);

    }


    document
        .getElementById("gameQuestion")
        .textContent = question;


    document
        .getElementById("gameAnswer")
        .value = "";


    document
        .getElementById("gameAnswer")
        .focus();


    document
        .getElementById("gameFeedback")
        .textContent = "";

}


/* Bắt đầu */

function startGame() {

    gameScore = 0;

    gameTotal = 0;


    document
        .getElementById("gameScore")
        .textContent = "0";


    document
        .getElementById("gameTotal")
        .textContent = "0";


    document
        .getElementById("gameCheck")
        .style.display = "block";


    document
        .getElementById("gameStart")
        .textContent = "Chơi lại";


    createQuestion();

}


/* Kiểm tra */

function checkGameAnswer() {

    const input =
        document
        .getElementById("gameAnswer")
        .value
        .trim();


    const feedback =
        document
        .getElementById("gameFeedback");


    if (input === "") {

        feedback.textContent =
            "⚠️ Hãy nhập đáp án.";

        return;
    }


    gameTotal++;


    if (input === gameAnswer) {

        gameScore++;


        feedback.textContent =
            "✓ Chính xác!";

    }

    else {

        feedback.textContent =
            "✗ Sai. Đáp án đúng là " +
            gameAnswer;

    }


    document
        .getElementById("gameScore")
        .textContent =
        gameScore;


    document
        .getElementById("gameTotal")
        .textContent =
        gameTotal;


    /*
       Đợi một chút rồi
       chuyển sang câu mới.
    */

    setTimeout(
        createQuestion,
        2000
    );

}

</script>

</body>
</html>
